apiVersion: v1
kind: ConfigMap
metadata:
  name: teranode-config
  namespace: teranode
data:
  config.yaml: |
    # PostgreSQL optimized configuration for teranode-p2p
    p2p:
      port: 9901

      # Bootstrap peers for libp2p discovery (no DHT in this POC).
      # /dnsaddr/ entries resolve via DNS TXT to current bootstrap multiaddrs.
      # Managed by BSV Association — contact BSVA to be added.
      # Override with pipe-separated /dns4/ or /ip4/ multiaddrs.
      bootstrap_peers:
        - "/dnsaddr/mainnet.bootstrap.teranode.bsvb.tech"
        - "/dnsaddr/testnet.bootstrap.teranode.bsvb.tech"
        - "/dnsaddr/teratestnet.bootstrap.teranode.bsvb.tech"
        - "/dnsaddr/tstn.bootstrap.teranode.bsvb.tech"

      dht_mode: "off"

      announce_addrs: []
      peer_cache_file: ""

      max_connections: 0
      min_connections: 0

    # PostgreSQL database configuration
    database:
      host: "postgres"  # Name of the PostgreSQL service in Kubernetes
      port: 5432
      user: "teranode"
      password: "teranode"
      name: "teranode_p2p"
      sslmode: "disable"  # Set to "require" for production

    # Networks to subscribe to (system generates all topic combinations)
    networks:
      - "mainnet"
      - "testnet"
      - "regtest"
      - "stn"
      - "teratestnet"
      - "tstn"

    # Topics to subscribe to
    topics:
      - "bitcoin/block"
      - "bitcoin/subtree"
      - "bitcoin/handshake"
      - "bitcoin/rejected_tx"
      - "bitcoin/node_status"