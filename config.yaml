# PostgreSQL optimized configuration for teranode-p2p
p2p:
  port: 9901

  # Bootstrap peers for libp2p discovery (no DHT in this POC).
  # /dnsaddr/ entries resolve via DNS TXT to current bootstrap multiaddrs.
  # Managed by BSV Association — contact BSVA to be added.
  # Override with pipe-separated /dns4/ or /ip4/ multiaddrs.
  bootstrap_peers:
    - "/dnsaddr/mainnet.bootstrap.teranode.bsvb.tech"
    - "/dnsaddr/testnet.bootstrap.teranode.bsvb.tech"
    - "/dnsaddr/teratestnet.bootstrap.teranode.bsvb.tech"

  dht_mode: "off"           # off | client | server

  announce_addrs: []        # optional; empty = libp2p auto-detect
  peer_cache_file: ""       # optional; "" disables peer cache persistence

  # Connection manager (zero = library defaults)
  max_connections: 0
  min_connections: 0

# PostgreSQL database configuration
database:
  host: "localhost"  # Use "postgres" if running in Docker network
  port: 5432
  user: "teranode"
  password: "teranode"
  name: "teranode_p2p"
  sslmode: "disable"  # Set to "require" for production

# Networks to subscribe to (system generates all topic combinations)
networks:
  - "mainnet"
  - "testnet"
  - "teratestnet"

# Optional Redis cache configuration
redis:
  enabled: true
  host: "localhost"  # Use "redis" if running in Docker network
  port: 6379
  password: ""
  db: 0
  cache_ttl: 60  # Cache TTL in seconds

# Performance tuning
performance:
  batch_size: 1000  # Number of messages to batch before inserting
  batch_interval: 5  # Seconds between batch flushes
  stats_interval: 60  # Seconds between stats calculations
  materialized_view_refresh: 300  # Seconds between materialized view refreshes
  partition_retention_months: 3  # Keep current + (N-1) prior months; older data is pruned

# Monitoring
monitoring:
  slow_query_threshold: 1000  # Log queries slower than this (ms)
  enable_metrics: true
  metrics_port: 9090