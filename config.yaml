# PostgreSQL optimized configuration for teranode-p2p
p2p:
  bootstrap_addresses:
    - "/dns4/teranode-bootstrap.bsvb.tech/tcp/9901/p2p/12D3KooWESmhNAN8s6NPdGNvJH3zJ4wMKDxapXKNUe2DzkAwKYqK"
    - "/dns4/teranode-bootstrap-stage.bsvb.tech/tcp/9901/p2p/12D3KooWJ6kQHAR65xkA34NABsNVAJyVxPWh8JUSo1vtZsTyw4GD"
  shared_key: "285b49e6d910726a70f205086c39cbac6d8dcc47839053a21b1f614773bbc137"
  dht_protocol_id: "/teranode"
  port: 9901
  listen_addresses:
    - "127.0.0.1"
  advertise: true
  use_private_dht: true

# PostgreSQL database configuration
database:
  host: "localhost"  # Use "postgres" if running in Docker network
  port: 5432
  user: "teranode"
  password: "teranode"
  name: "teranode_p2p"
  sslmode: "disable"  # Set to "require" for production

# Networks to subscribe to (system generates all topic combinations)
networks:
  - "mainnet"
  - "testnet"
  - "teratestnet"
  - "tstn"

# Optional Redis cache configuration
redis:
  enabled: true
  host: "localhost"  # Use "redis" if running in Docker network
  port: 6379
  password: ""
  db: 0
  cache_ttl: 60  # Cache TTL in seconds

# Performance tuning
performance:
  batch_size: 1000  # Number of messages to batch before inserting
  batch_interval: 5  # Seconds between batch flushes
  stats_interval: 60  # Seconds between stats calculations
  materialized_view_refresh: 300  # Seconds between materialized view refreshes
  partition_cleanup_days: 90  # Days to keep old partitions

# Monitoring
monitoring:
  slow_query_threshold: 1000  # Log queries slower than this (ms)
  enable_metrics: true
  metrics_port: 9090