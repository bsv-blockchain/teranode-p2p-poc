<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Message Viewer</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 800px; margin: 30px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 24px; }
    h1 { margin-top: 0; }
    form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    form input, form button { padding: 8px; font-size: 1em; }
    .messages { max-height: 500px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; background: #fafbfc; padding: 12px; }
    .msg { padding: 8px 0; border-bottom: 1px solid #eee; }
    .msg:last-child { border-bottom: none; }
    .msg-topic { color: #1a73e8; font-weight: bold; }
    .msg-peer { color: #555; font-size: 0.95em; }
    .msg-time { color: #999; font-size: 0.9em; margin-left: 8px; }
    .msg-data { margin: 4px 0 0 0; font-family: monospace; word-break: break-all; }
    .realtime-badge { background: #1a73e8; color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 0.85em; margin-left: 8px; }
    .search-bar { flex: 1; min-width: 120px; }
    .status { margin: 10px 0 0 0; font-size: 0.95em; color: #1a73e8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>P2P Message Viewer <span id="ws-status" class="realtime-badge">Connecting...</span></h1>
    <form id="search-form">
      <input class="search-bar" type="text" id="topic" placeholder="Topic (optional)">
      <input class="search-bar" type="text" id="peer" placeholder="Peer (optional)">
      <input class="search-bar" type="number" id="limit" placeholder="Limit (default 100)" min="1" max="500">
      <button type="submit">Search</button>
      <button type="button" id="clear-btn">Clear</button>
    </form>
    <div class="messages" id="messages"></div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const wsStatus = document.getElementById('ws-status');
    const messagesDiv = document.getElementById('messages');
    const statusDiv = document.getElementById('status');
    let ws;
    let allMessages = [];

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleString();
    }

    function renderMessages(msgs) {
      messagesDiv.innerHTML = '';
      if (!msgs.length) {
        messagesDiv.innerHTML = '<div style="color:#aaa">No messages found.</div>';
        return;
      }
      msgs.forEach(msg => {
        const el = document.createElement('div');
        el.className = 'msg';
        el.innerHTML = `
          <span class="msg-topic">${msg.Topic}</span>
          <span class="msg-peer">from ${msg.Peer}</span>
          <span class="msg-time">${formatTime(msg.ReceivedAt)}</span>
          <div class="msg-data">${msg.Data}</div>
        `;
        messagesDiv.appendChild(el);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addRealtimeMessage(msg) {
      allMessages.push(msg);
      renderMessages(allMessages);
    }

    function connectWebSocket() {
      ws = new WebSocket(`ws://${window.location.hostname}:8080/ws`);
      ws.onopen = () => {
        wsStatus.textContent = 'Live';
        wsStatus.style.background = '#28a745';
      };
      ws.onclose = () => {
        wsStatus.textContent = 'Disconnected';
        wsStatus.style.background = '#e63946';
        setTimeout(connectWebSocket, 2000); // try reconnect
      };
      ws.onerror = () => {
        wsStatus.textContent = 'Error';
        wsStatus.style.background = '#e63946';
      };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        statusDiv.textContent = 'New realtime message received.';
        addRealtimeMessage(msg);
      };
    }

    async function searchMessages(e) {
      if (e) e.preventDefault();
      const topic = document.getElementById('topic').value.trim();
      const peer = document.getElementById('peer').value.trim();
      const limit = document.getElementById('limit').value.trim();
      let url = `http://${window.location.hostname}:8080/messages?`;
      if (topic) url += `topic=${encodeURIComponent(topic)}&`;
      if (peer) url += `peer=${encodeURIComponent(peer)}&`;
      if (limit) url += `limit=${encodeURIComponent(limit)}&`;
      statusDiv.textContent = 'Searching...';
      try {
        const res = await fetch(url);
        const msgs = await res.json();
        allMessages = msgs;
        renderMessages(msgs);
        statusDiv.textContent = `Found ${msgs.length} messages.`;
      } catch (err) {
        statusDiv.textContent = 'Error fetching messages.';
      }
    }

    document.getElementById('search-form').onsubmit = searchMessages;
    document.getElementById('clear-btn').onclick = (e) => {
      document.getElementById('topic').value = '';
      document.getElementById('peer').value = '';
      document.getElementById('limit').value = '';
      allMessages = [];
      renderMessages([]);
      statusDiv.textContent = '';
    };

    // Initial load
    searchMessages();
    connectWebSocket();
  </script>
</body>
</html>
